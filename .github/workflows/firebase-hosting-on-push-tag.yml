# https://github.com/firebase/firebase-tools

name: Deploy to Firebase Hosting on push tag
on:
  push:
    tags:
      - '*.*.*'
  # Called by release.yml, since tags pushed with GITHUB_TOKEN don't trigger the push event
  workflow_call:
    inputs:
      tag:
        type: string
        required: true
jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    # Deploy indexes first so new queries work once the new hosting goes live
    needs: deploy_firestore
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - uses: pnpm/action-setup@v4
        with:
          run_install: false
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - run: |
          echo "${{ secrets.PROD_CLIENT_ENV }}" > .env
      - run: pnpm build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: ${{ secrets.GITHUB_TOKEN }}
          firebaseServiceAccount: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_NPRD_SCRUM_POKER_PROD }}
          channelId: live
          projectId: nprd-scrum-poker-prod
  deploy_firestore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag || github.ref }}
      - name: Install Firebase CLI
        run: npm install -g firebase-tools
      - uses: 'google-github-actions/auth@v2'
        with:
          credentials_json: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_NPRD_SCRUM_POKER_PROD }}'
      - name: Deploy firestore rules and indexes
        run: firebase deploy -f --only firestore --project nprd-scrum-poker-prod
